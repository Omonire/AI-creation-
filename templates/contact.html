<section id="contact" class="py-20 bg-gray-900">
    <div class="container mx-auto px-6">
        <h2 class="text-4xl font-bold text-center mb-12 gradient-text">Get In Touch</h2>
        <div class="max-w-2xl mx-auto bg-gray-800 p-8 rounded-lg shadow-lg">
            <p class="text-center text-gray-400 mb-8">
                I'm currently open to new opportunities. If you have a question or just want to say hi, feel free to send me a message.
            </p>
            <form id="contact-form">
                <div class="mb-4">
                    <label for="name" class="block text-gray-300 text-sm font-bold mb-2">Name</label>
                    <input type="text" id="name" name="name" required
                           class="w-full bg-gray-700 border border-gray-600 rounded py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:bg-gray-600 focus:border-teal-500">
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-gray-300 text-sm font-bold mb-2">Email</label>
                    <input type="email" id="email" name="email" required
                           class="w-full bg-gray-700 border border-gray-600 rounded py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:bg-gray-600 focus:border-teal-500">
                </div>
                <div class="mb-6">
                    <label for="message" class="block text-gray-300 text-sm font-bold mb-2">Message</label>
                    <textarea id="message" name="message" rows="5" required
                              class="w-full bg-gray-700 border border-gray-600 rounded py-2 px-3 text-gray-200 leading-tight focus:outline-none focus:bg-gray-600 focus:border-teal-500"></textarea>
                </div>
                <div class="text-center">
                    <button type="submit"
                            class="bg-teal-500 hover:bg-teal-600 text-white font-bold py-3 px-8 rounded-full transition duration-300 transform hover:scale-105">
                        Send Message
                    </button>
                </div>
            </form>
            <div id="form-feedback" class="text-center mt-4 text-teal-400"></div>
        </div>
    </div>
</section>
